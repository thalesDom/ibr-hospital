</head>

        <a href="medicos.html" class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><span>Médicos</span></a>
        <a href="servicos.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>Serviços Médicos</span></a>
        <a href="especialidades.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Especialidades</span></a>
        <a href="documentos.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 12 18 15 15"/><line x1="12" y1="18" x2="12" y2="11"/></svg>
          <span>Documentos</span>
        </a>
      </div>
      <div class="nav-section"><span class="nav-section-label">Atendimento</span>
        <a href="contato.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg><span>Contato</span><span class="nav-badge nav-badge--red" id="badgeContato"></span></a>
        <a href="ouvidoria.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg><span>Ouvidoria</span><span class="nav-badge nav-badge--red" id="badgeOuvidoria"></span></a>
      </div>
      <div class="nav-section"><span class="nav-section-label">RH</span>
        <a href="vagas.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg><span>Vagas</span></a>
        <a href="curriculos.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Currículos</span><span class="nav-badge nav-badge--red" id="badgeCurriculos"></span></a>
      </div>

    <script>(function(){var nav=document.querySelector('.sidebar-nav');function ir(){try{var p=(location.pathname.split('/').pop()||'index.html');var l=nav&&nav.querySelector('a[href="'+p+'"]');if(l&&nav){var nr=nav.getBoundingClientRect();var lr=l.getBoundingClientRect();if(lr.top<nr.top)nav.scrollTop-=(nr.top-lr.top);else if(lr.bottom>nr.bottom)nav.scrollTop+=(lr.bottom-nr.bottom);}}catch(e){}if(nav)nav.style.visibility='visible';}requestAnimationFrame(function(){requestAnimationFrame(ir);});})();</script>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="userAvatar">A</div><div><p class="user-name" id="userName">—</p><p class="user-role" id="userRole">Admin</p></div></div>
      <button class="btn-logout" id="btnLogout" title="Sair"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-toggle-sidebar" id="toggleSidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div><h1 class="page-title">Médicos</h1><p class="page-sub">Gerenciar corpo clínico</p></div>
      </div>
      <div class="topbar-right">
        <input type="text" id="searchInput" placeholder="Buscar médico..." class="search-input" oninput="filtrarTabela()"/>
        <select id="filtroEsp" class="btn btn--outline" onchange="filtrarTabela()" style="cursor:pointer">
          <option value="">Todas especialidades</option>
        </select>
        <button class="btn btn--primary" onclick="abrirModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Médico
        </button>
      </div>
    </header>

    <div class="content">
      <div class="table-wrap">
        <div class="table-header">
          <h2>Todos os Médicos <span id="totalCount" style="font-size:.8rem;font-weight:400;color:#7a90b3;margin-left:8px"></span></h2>
        </div>
        <div id="tableContent"><div style="padding:40px;text-align:center;color:#7a90b3">Carregando...</div></div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalMedico">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Novo Médico</h3>
        <button class="modal-close" onclick="closeModal('modalMedico')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="mId"/>
        <div class="form-row">
          <div class="form-group">
            <label>Título</label>
            <select id="mTitulo">
              <option>Dr.</option><option>Dra.</option><option value=""></option>
            </select>
          </div>
          <div class="form-group" style="flex:3">
            <label>Nome Completo *</label>
            <input type="text" id="mNome" placeholder="Nome do médico"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Especialidade *</label>
            <input type="text" id="mEspecialidade" placeholder="Ex: Cardiologia" list="espList"/>
            <datalist id="espList">
              <option>Cardiologia</option><option>Ortopedia</option><option>Neurologia</option>
              <option>Neurocirurgia</option><option>Cirurgia Geral</option><option>Oftalmologia</option>
              <option>Dermatologia</option><option>Pediatria</option><option>Oncologia</option>
              <option>Pneumologia</option><option>Urologia</option><option>Reumatologia</option>
              <option>Gastroenterologia</option><option>Endocrinologia</option><option>Infectologia</option>
              <option>Nefrologia</option><option>Hematologia</option><option>Angiologia</option>
              <option>Psicologia</option><option>Otorrinolaringologia</option>
              <option>Cirurgia Cardiovascular</option><option>Cirurgia Plástica</option>
              <option>Cirurgia de Coluna</option><option>Cirurgia Torácica</option>
              <option>Bucomaxilofacial</option><option>Coloproctologia</option>
            </datalist>
          </div>
          <div class="form-group">
            <label>Sub-especialidade</label>
            <input type="text" id="mSubEspecialidade" placeholder="Ex: Quadril, Coluna..."/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>CRM</label>
            <input type="text" id="mCrm" placeholder="CRM-BA 00000"/>
          </div>
          <div class="form-group">
            <label>Ordem de exibição</label>
            <input type="number" id="mOrdem" placeholder="0" value="0"/>
          </div>
        </div>
        <div class="form-group">
          <label>Foto</label>
          <img id="mImgPreview" style="display:none;width:110px;height:110px;object-fit:cover;border-radius:50%;border:1px solid #e2e8f2;margin-bottom:8px"/>
          <input type="file" id="mFotoArquivo" accept="image/jpeg,image/png,image/webp,image/gif"/>
          <input type="hidden" id="mFotoAtual"/>
        </div>
        <div class="form-group">
          <label>Mini Bio</label>
          <textarea id="mBio" rows="3" placeholder="Breve descrição do médico..."></textarea>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="mAtivo"><option value="1">Ativo</option><option value="0">Inativo</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--outline" onclick="closeModal('modalMedico')">Cancelar</button>
        <button class="btn btn--primary" id="btnSalvar" onclick="salvarMedico()">Salvar Médico</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
  let todosMedicos = [];

  async function carregarMedicos() {
    const r = await fetch(`${API}/medicos.php?action=lista`);
    const d = await r.json();
    if (!d.success) return;
    todosMedicos = d.medicos;

    // Populate filter
    const sel = document.getElementById('filtroEsp');
    const esps = [...new Set(d.medicos.map(m => m.especialidade))].sort();
    esps.forEach(e => { const o = document.createElement('option'); o.value = e; o.textContent = e; sel.appendChild(o); });

    renderTabela(todosMedicos);
  }

  function filtrarTabela() {
    const q   = document.getElementById('searchInput').value.toLowerCase();
    const esp = document.getElementById('filtroEsp').value;
    const lista = todosMedicos.filter(m =>
      (!esp || m.especialidade === esp) &&
      (!q || m.nome.toLowerCase().includes(q) || m.especialidade.toLowerCase().includes(q))
    );
    renderTabela(lista);
  }

  function renderTabela(lista) {
    const el = document.getElementById('tableContent');
    document.getElementById('totalCount').textContent = `(${lista.length})`;

    if (!lista.length) {
      el.innerHTML = '<div class="empty-state"><p>Nenhum médico encontrado.</p></div>'; return;
    }

    el.innerHTML = `<table>
      <thead><tr><th>Nome</th><th>Especialidade</th><th>Sub-esp.</th><th>CRM</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${lista.map(m => `<tr>
        <td><strong>${m.titulo ? m.titulo + ' ' : ''}${m.nome}</strong></td>
        <td>${m.especialidade}</td>
        <td>${m.sub_especialidade || '—'}</td>
        <td>${m.crm || '—'}</td>
        <td><span class="badge ${m.ativo=='1'?'badge--green':'badge--gray'}">${m.ativo=='1'?'Ativo':'Inativo'}</span></td>
        <td><div style="display:flex;gap:6px">
          <button class="btn btn--outline btn--sm btn--icon" onclick="editarMedico(${m.id})" title="Editar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn--outline btn--sm btn--icon" onclick="toggleMedico(${m.id})" title="Ativar/Desativar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </button>
          <button class="btn btn--danger btn--sm btn--icon" onclick="excluirMedico(${m.id})" title="Excluir">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          </button>
        </div></td>
      </tr>`).join('')}
      </tbody></table>`;
  }

  function abrirModal(m = null) {
    document.getElementById('mId').value          = m?.id || '';
    document.getElementById('mTitulo').value      = m?.titulo || 'Dr.';
    document.getElementById('mNome').value        = m?.nome || '';
    document.getElementById('mEspecialidade').value   = m?.especialidade || '';
    document.getElementById('mSubEspecialidade').value= m?.sub_especialidade || '';
    document.getElementById('mCrm').value         = m?.crm || '';
    document.getElementById('mFotoAtual').value   = m?.foto || '';
    document.getElementById('mFotoArquivo').value = '';
    const mPrev = document.getElementById('mImgPreview');
    if (m?.foto) { mPrev.src = m.foto; mPrev.style.display = 'block'; }
    else { mPrev.src = ''; mPrev.style.display = 'none'; }
    document.getElementById('mBio').value         = m?.bio || '';
    document.getElementById('mAtivo').value       = m?.ativo ?? '1';
    document.getElementById('mOrdem').value       = m?.ordem || '0';
    document.getElementById('modalTitle').textContent = m ? 'Editar Médico' : 'Novo Médico';
    openModal('modalMedico');
  }

  async function editarMedico(id) {
    const d = await fetch(`${API}/medicos.php?action=get&id=${id}`).then(r => r.json());
    if (d.success) abrirModal(d.medico);
  }

  async function salvarMedico() {
    const btn = document.getElementById('btnSalvar');
    btn.textContent = 'Salvando...'; btn.disabled = true;
    const body = new FormData();
    body.append('action', 'salvar');
    body.append('id', document.getElementById('mId').value);
    body.append('titulo', document.getElementById('mTitulo').value);
    body.append('nome', document.getElementById('mNome').value);
    body.append('especialidade', document.getElementById('mEspecialidade').value);
    body.append('sub_especialidade', document.getElementById('mSubEspecialidade').value);
    body.append('crm', document.getElementById('mCrm').value);
    body.append('foto_atual', document.getElementById('mFotoAtual').value);
    const mArquivo = document.getElementById('mFotoArquivo').files[0];
    if (mArquivo) body.append('foto_arquivo', mArquivo);
    body.append('bio', document.getElementById('mBio').value);
    body.append('ativo', document.getElementById('mAtivo').value);
    body.append('ordem', document.getElementById('mOrdem').value);

    const d = await fetch(`${API}/medicos.php`, { method: 'POST', body }).then(r => r.json());
    toast(d.message, d.success ? 'success' : 'error');
    if (d.success) { closeModal('modalMedico'); carregarMedicos(); }
    btn.textContent = 'Salvar Médico'; btn.disabled = false;
  }

  async function toggleMedico(id) {
    const b = new FormData(); b.append('action','toggle'); b.append('id',id);
    const d = await fetch(`${API}/medicos.php`,{method:'POST',body:b}).then(r=>r.json());
    toast(d.message, d.success?'success':'error');
    if (d.success) carregarMedicos();
  }

  async function excluirMedico(id) {
    confirmDelete('Excluir este médico?', async () => {
      const b = new FormData(); b.append('action','excluir'); b.append('id',id);
      const d = await fetch(`${API}/medicos.php`,{method:'POST',body:b}).then(r=>r.json());
      toast(d.message, d.success?'success':'error');
      if (d.success) carregarMedicos();
    });
  }

  // Search input style
  document.head.insertAdjacentHTML('beforeend',`<style>
    .search-input { padding:9px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:.875rem; font-family:inherit; outline:none; width:220px; transition:all .2s; }
    .search-input:focus { border-color:#1a5ccc; box-shadow:0 0 0 3px rgba(26,92,204,.1); }
  </style>`);

  document.getElementById('mFotoArquivo').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const mPrev = document.getElementById('mImgPreview');
    mPrev.src = URL.createObjectURL(f);
    mPrev.style.display = 'block';
  });

  document.addEventListener('ibr:ready', carregarMedicos);
  </script>
</body>
</html>
