  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-toggle-sidebar" id="toggleSidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div><h1 class="page-title">Currículos</h1><p class="page-sub">Candidatos que se inscreveram nas vagas</p></div>
      </div>
      <div class="topbar-right">
        <select id="filtroVaga" class="btn btn--outline" onchange="carregarCurriculos()" style="cursor:pointer"><option value="">Todas as vagas</option></select>
        <select id="filtroLido" class="btn btn--outline" onchange="carregarCurriculos()" style="cursor:pointer"><option value="">Todos</option><option value="0">Não lidos</option><option value="1">Lidos</option></select>
      </div>
    </header>
    <div class="content">
      <div class="table-wrap">
        <div class="table-header"><h2 id="tableTitle">Todos os Currículos</h2></div>
        <div id="tableContent"><div style="padding:40px;text-align:center;color:#7a90b3">Carregando...</div></div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalCurriculo">
    <div class="modal">
      <div class="modal-header">
        <h3>Dados do Candidato</h3>
        <button class="modal-close" onclick="closeModal('modalCurriculo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="modalCurriculoBody"></div>
      <div class="modal-footer"><button class="btn btn--outline" onclick="closeModal('modalCurriculo')">Fechar</button></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
  async function carregarFiltroVagas() {
    const d = await fetch(`${API}/vagas.php?action=lista`).then(r=>r.json());
    if (!d.success) return;
    const sel = document.getElementById('filtroVaga');
    d.vagas.forEach(v => { const opt=document.createElement('option'); opt.value=v.id; opt.textContent=v.titulo; sel.appendChild(opt); });
    const params = new URLSearchParams(window.location.search);
    if (params.get('vaga')) sel.value = params.get('vaga');
  }
  let CVS = {};
  async function carregarCurriculos() {
    const vaga=document.getElementById('filtroVaga').value;
    const lido=document.getElementById('filtroLido').value;
    let url=`${API}/vagas.php?action=curriculos`;
    if (vaga) url+=`&vaga_id=${vaga}`;
    if (lido!=='') url+=`&lido=${lido}`;
    const d=await fetch(url).then(r=>r.json());
    const el=document.getElementById('tableContent');
    const lista=(d.curriculos||[]).map(c=>safeFields(c));
    CVS=Object.fromEntries(lista.map(c=>[c.id,c]));
    if (!d.success||!lista.length) {
      el.innerHTML='<div class="empty-state"><p>Nenhum currículo encontrado.</p></div>'; return;
    }
    el.innerHTML=`<table><thead><tr><th>Candidato</th><th>Vaga</th><th>Contato</th><th>Status</th><th>Recebido em</th><th>Ações</th></tr></thead>
    <tbody>${lista.map(c=>`<tr style="${c.lido=='0'?'font-weight:600;background:#fafbff':''}">
      <td>${c.nome}</td>
      <td>${c.vaga_titulo||'<em style="color:#7a90b3">Candidatura espontânea</em>'}</td>
      <td><div>${c.email}</div><div style="font-size:.78rem;color:#7a90b3">${c.telefone||'—'}</div></td>
      <td><span class="badge ${c.lido=='1'?'badge--gray':'badge--orange'}">${c.lido=='1'?'Lido':'Novo'}</span></td>
      <td>${fmtDateTime(c.created_at)}</td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn--outline btn--sm" onclick="verCurriculo(${Number(c.id)})">Ver</button>
        ${c.arquivo?`<a href="${API}/vagas.php?action=baixar_curriculo&id=${Number(c.id)}" target="_blank" class="btn btn--primary btn--sm">Baixar CV</a>`:''}
        <button class="btn btn--danger btn--sm btn--icon" onclick="excluirCurriculo(${c.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
      </div></td>
    </tr>`).join('')}</tbody></table>`;
  }
  async function verCurriculo(id) {
    const c = CVS[id]; if (!c) return;
    if (c.lido==0) { const b=new FormData(); b.append('action','marcar_lido'); b.append('id',c.id); await fetch(`${API}/vagas.php`,{method:'POST',body:b}); }
    document.getElementById('modalCurriculoBody').innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:4px">Nome</p><p style="font-weight:600">${c.nome}</p></div>
        <div><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:4px">Vaga</p><p>${c.vaga_titulo||'Candidatura espontânea'}</p></div>
        <div><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:4px">Email</p><a href="mailto:${c.email}" style="color:#1a5ccc">${c.email}</a></div>
        <div><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:4px">Telefone</p><p>${c.telefone||'—'}</p></div>
      </div>
      ${c.mensagem?`<div style="background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:16px"><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:8px">Mensagem</p><p style="font-size:.9rem;line-height:1.7;color:#3d5175;white-space:pre-wrap">${c.mensagem}</p></div>`:''}
      ${c.arquivo?`<div><p style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:#7a90b3;margin-bottom:8px">Currículo Anexo</p><a href="${API}/vagas.php?action=baixar_curriculo&id=${Number(c.id)}" target="_blank" class="btn btn--primary">Baixar Currículo</a></div>`:'<p style="color:#7a90b3;font-size:.875rem">Nenhum arquivo anexado.</p>'}`;
    openModal('modalCurriculo');
    carregarCurriculos();
  }
  async function excluirCurriculo(id) {
    confirmDelete('Excluir este currículo permanentemente?', async()=>{
      const b=new FormData(); b.append('action','excluir_curriculo'); b.append('id',id);
      const d=await fetch(`${API}/vagas.php`,{method:'POST',body:b}).then(r=>r.json());
      toast(d.message,d.success?'success':'error'); if(d.success) carregarCurriculos();
    });
  }
  document.addEventListener('ibr:ready', async () => {
    await carregarFiltroVagas();
    carregarCurriculos();
  });
  </script>
</body>
